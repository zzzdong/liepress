[package]
name = "liepress"
version = "0.1.0-beta.1"
description = "A Markdown to PDF/SVG/PNG converter with CSS styling support"
authors = ["zzzdong <kuwater@163.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/zzzdong/liepress"
homepage = "https://github.com/zzzdong/liepress"
keywords = ["markdown", "pdf", "svg", "png", "document"]
categories = ["command-line-utilities", "rendering", "text-processing"]
edition = "2024"

[[bin]]
name = "liepress"
path = "src/bin/liepress.rs"

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
html5ever = "0.39.0"
pulldown-cmark = "0.13.4"
lightningcss = "1.0.0-alpha.71"
image = { version = "0.25" }
kamadak-exif = "0.6"
krilla = "0.8"
parley = "0.10.0"
thiserror = "2.0"
vello_cpu = "0.0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
lopdf = "0.40"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[workspace]
members = ["site"]

[lib]
crate-type = ["rlib", "cdylib"]
