[package]
name = "liepress"
version = "0.2.0"
description = "A Markdown/HTML to PDF converter with CSS styling support"
authors = ["zzzdong <kuwater@163.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/zzzdong/liepress"
homepage = "https://github.com/zzzdong/liepress"
keywords = ["markdown", "html", "pdf", "document"]
categories = ["command-line-utilities", "rendering", "text-processing"]
edition = "2024"

[[bin]]
name = "liepress"
path = "src/bin/liepress.rs"

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
docx-rs = "0.4"
html5ever = "0.39.0"
lightningcss = { version = "1.0.0-alpha.71", default-features = false }
image = { version = "0.25" }
kamadak-exif = "0.6"
krilla = "0.8"
pulldown-cmark = "0.13.4"
syntect = { version = "5", default-features = false, features = ["default-themes", "default-syntaxes", "parsing", "regex-fancy"] }
thiserror = "2.0"
vello_cpu = "0.2.0"
liecharts = { version = "0.1", optional = true }
liemermaid = { version = "0.1.0-alpha.2", optional = true }
lievisual = { version = "0.1" }

[features]
default = []
charts = ["dep:liecharts"]
mermaid = ["dep:liemermaid"]


[patch.crates-io]
# 开发期用本地 liemermaid 覆盖 crates.io 版本（patch 模式）。
#liemermaid = { path = "../liemermaid" }
# 开发期用本地 liecharts 覆盖 crates.io 版本（patch 模式）。
#liecharts = { path = "../liecharts" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
lopdf = "0.44"
zip = "8"

[profile.release]
lto = "thin"
codegen-units = 16
strip = "symbols"

[workspace]
members = ["site"]
