<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>liepress - Markdown to PDF</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/editor/editor.main.css" />
</head>
<body>
  <header class="app-header">
    <h1>liepress <span class="badge">WASM</span></h1>
    <p class="subtitle">Markdown -> PDF (WASM build)</p>
    <nav class="header-nav">
      <a href="https://github.com/zzzdong/liepress" target="_blank" rel="noopener" class="nav-link">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" />
        </svg>
        GitHub
      </a>
    </nav>
  </header>

  <main class="container">
    <section class="panel editor">
      <div class="panel-toolbar">
        <div class="toolbar-group">
          <button id="render-pdf" class="btn btn-primary">Render PDF</button>
        </div>
      </div>
      <div id="monacoEditor" class="editor-surface"></div>
    </section>

    <section class="panel output">
      <div class="panel-toolbar">
        <div class="toolbar-group">
          <label class="toolbar-label">Output</label>
        </div>
        <div class="toolbar-group">
          <button id="download-pdf" class="btn" disabled>Download PDF</button>
        </div>
      </div>
      <div id="pdf-host" class="pdf-host"></div>
      <div id="output" class="output-box hidden"></div>
      <div id="status" class="status">ready</div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
